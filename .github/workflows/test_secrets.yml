name: Test Secrets Configuration

on:
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Test VirusTotal API Key
        run: |
          if [ -n "${{ secrets.VIRUSTOTAL_API_KEY }}" ]; then
            echo "✅ VirusTotal API Key is configured"
          else
            echo "❌ VirusTotal API Key is missing"
            echo "Error: Please add your VirusTotal API key in repository settings"
            echo "Location: Settings > Secrets and variables > Actions"
            echo "Name: VIRUSTOTAL_API_KEY"
            exit 1
          fi
      
      - name: Test Slack Bot Token
        run: |
          if [ -n "${{ secrets.SLACK_BOT_TOKEN }}" ]; then
            echo "✅ Slack Bot Token is configured"
          else
            echo "❌ Slack Bot Token is missing"
            echo "Error: Please add your Slack Bot Token in repository settings"
            echo "Location: Settings > Secrets and variables > Actions"
            echo "Name: SLACK_BOT_TOKEN"
            echo "How to get:"
            echo "1. Go to api.slack.com/apps"
            echo "2. Select your app"
            echo "3. Go to 'OAuth & Permissions'"
            echo "4. Copy 'Bot User OAuth Token'"
            exit 1
          fi
      
      - name: Test Slack App Token
        run: |
          if [ -n "${{ secrets.SLACK_APP_TOKEN }}" ]; then
            echo "✅ Slack App Token is configured"
          else
            echo "❌ Slack App Token is missing"
            echo "Error: Please add your Slack App Token in repository settings"
            echo "Location: Settings > Secrets and variables > Actions"
            echo "Name: SLACK_APP_TOKEN"
            echo "How to get:"
            echo "1. Go to api.slack.com/apps"
            echo "2. Select your app"
            echo "3. Go to 'Basic Information'"
            echo "4. Copy 'App-Level Token'"
            exit 1
          fi
      
      - name: Test Shodan API Key
        run: |
          if [ -n "${{ secrets.SHODAN_API_KEY }}" ]; then
            echo "✅ Shodan API Key is configured"
          else
            echo "❌ Shodan API Key is missing"
            echo "Error: Please add your Shodan API key in repository settings"
            echo "Location: Settings > Secrets and variables > Actions"
            echo "Name: SHODAN_API_KEY"
            echo "How to get:"
            echo "1. Go to account.shodan.io"
            echo "2. Click on 'API Key'"
            echo "3. Copy your API key"
            exit 1
          fi
      
      - name: Test API Key Format
        run: |
          # Test VirusTotal API Key format (should be 64 characters)
          if [[ "${{ secrets.VIRUSTOTAL_API_KEY }}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "✅ VirusTotal API Key format is valid"
          else
            echo "❌ VirusTotal API Key format is invalid"
            echo "Error: VirusTotal API key should be 64 hexadecimal characters"
            echo "Current length: ${#VIRUSTOTAL_API_KEY}"
            echo "Expected format: 64 characters of [0-9a-f]"
            exit 1
          fi
          
          # Test Slack Bot Token format (should start with xoxb-)
          if [[ "${{ secrets.SLACK_BOT_TOKEN }}" =~ ^xoxb- ]]; then
            echo "✅ Slack Bot Token format is valid"
          else
            echo "❌ Slack Bot Token format is invalid"
            echo "Error: Slack Bot Token should start with 'xoxb-'"
            echo "Current format: ${SLACK_BOT_TOKEN:0:5}..."
            echo "Expected format: xoxb-..."
            echo "Common issues:"
            echo "1. Copied wrong token (App Token instead of Bot Token)"
            echo "2. Token not properly copied (missing characters)"
            echo "3. Token from wrong app or workspace"
            exit 1
          fi
          
          # Test Slack App Token format (should start with xapp-)
          if [[ "${{ secrets.SLACK_APP_TOKEN }}" =~ ^xapp- ]]; then
            echo "✅ Slack App Token format is valid"
          else
            echo "❌ Slack App Token format is invalid"
            echo "Error: Slack App Token should start with 'xapp-'"
            echo "Current format: ${SLACK_APP_TOKEN:0:5}..."
            echo "Expected format: xapp-..."
            echo "Common issues:"
            echo "1. Copied wrong token (Bot Token instead of App Token)"
            echo "2. Token not properly copied (missing characters)"
            echo "3. Token from wrong app or workspace"
            exit 1
          fi
          
          # Test Shodan API Key format (should be 32 characters)
          if [[ "${{ secrets.SHODAN_API_KEY }}" =~ ^[a-zA-Z0-9]{32}$ ]]; then
            echo "✅ Shodan API Key format is valid"
          else
            echo "❌ Shodan API Key format is invalid"
            echo "Error: Shodan API key should be 32 alphanumeric characters"
            echo "Current length: ${#SHODAN_API_KEY}"
            echo "Expected format: 32 characters of [a-zA-Z0-9]"
            exit 1
          fi
      
      - name: Test API Connectivity
        run: |
          # Test VirusTotal API
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}" \
            "https://www.virustotal.com/api/v3/domains/example.com")
          if [ "$response" = "200" ]; then
            echo "✅ VirusTotal API is accessible"
          else
            echo "❌ VirusTotal API is not accessible (HTTP $response)"
            case $response in
              "401")
                echo "Error: Unauthorized - Invalid API key"
                echo "Please check if your VirusTotal API key is correct"
                ;;
              "403")
                echo "Error: Forbidden - API key has no permissions"
                echo "Please check your VirusTotal account permissions"
                ;;
              "429")
                echo "Error: Too Many Requests - API rate limit exceeded"
                echo "Please wait a few minutes before trying again"
                ;;
              *)
                echo "Error: Unexpected response from VirusTotal API"
                echo "Please check your internet connection and try again"
                ;;
            esac
            exit 1
          fi
          
          # Test Shodan API
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.shodan.io/api-info?key=${{ secrets.SHODAN_API_KEY }}")
          if [ "$response" = "200" ]; then
            echo "✅ Shodan API is accessible"
          else
            echo "❌ Shodan API is not accessible (HTTP $response)"
            case $response in
              "401")
                echo "Error: Unauthorized - Invalid API key"
                echo "Please check if your Shodan API key is correct"
                ;;
              "403")
                echo "Error: Forbidden - API key has no permissions"
                echo "Please check your Shodan account permissions"
                ;;
              "429")
                echo "Error: Too Many Requests - API rate limit exceeded"
                echo "Please wait a few minutes before trying again"
                ;;
              *)
                echo "Error: Unexpected response from Shodan API"
                echo "Please check your internet connection and try again"
                ;;
            esac
            exit 1
          fi

          # Test Slack API
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            "https://slack.com/api/auth.test")
          if [ "$response" = "200" ]; then
            echo "✅ Slack API is accessible"
          else
            echo "❌ Slack API is not accessible (HTTP $response)"
            case $response in
              "401")
                echo "Error: Unauthorized - Invalid Bot Token"
                echo "Please check if your Slack Bot Token is correct"
                echo "Make sure you're using the Bot User OAuth Token, not the App-Level Token"
                ;;
              "403")
                echo "Error: Forbidden - Bot has no permissions"
                echo "Please check your Slack app's OAuth scopes"
                echo "Required scopes: chat:write, commands, app_mentions:read"
                ;;
              *)
                echo "Error: Unexpected response from Slack API"
                echo "Please check your internet connection and try again"
                ;;
            esac
            exit 1
          fi 